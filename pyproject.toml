[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyforge-framework"
version = "0.7.0"
description = "A batteries-included web framework for Python, built on FastAPI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PyForge Contributors" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "starlette>=0.37",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",
]

[project.optional-dependencies]
auth = [
    "bcrypt>=4.0",
    "pyjwt>=2.8",
]
cache = ["redis>=5.0"]
queue = ["redis>=5.0"]
storage = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "mypy>=1.9",
    "ruff>=0.4",
    "fakeredis>=2.20",
    "aiosmtpd>=1.4",
    "moto[s3]>=5.0",
    "pyforge-framework[auth,cache,queue,storage]",
]

[project.scripts]
pyforge = "pyforge.console.cli:main"

[project.urls]
Homepage = "https://github.com/pyforge-framework/pyforge"
Documentation = "https://github.com/pyforge-framework/pyforge/tree/main/docs"
Issues = "https://github.com/pyforge-framework/pyforge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/pyforge/console/stubs"]

[tool.ruff.lint]
# UP017: prefer datetime.timezone.utc over datetime.UTC, and PYI034: prefer
# typing.Self over a hardcoded return type — both are functionally
# equivalent to the pre-3.11 spelling we use instead, which also runs on
# Python < 3.11, so there's no reason to prefer the newer one.
ignore = ["UP017", "PYI034", "PYI019"]

[tool.ruff.lint.per-file-ignores]
# DTZ001: the scheduler deliberately compares against naive, local-time
# datetimes — cron semantics are defined in the system's local timezone
# (the same as a real crontab), not UTC, so `datetime.now()`/naive
# `datetime(...)` here are correct, not an oversight. Everywhere else in
# the codebase that touches wall-clock time (JWT `iat`/`exp`, ORM
# timestamps) already uses `timezone.utc` deliberately, so this rule stays
# enabled by default rather than being silenced project-wide.
"src/pyforge/scheduler/*.py" = ["DTZ001", "DTZ005"]
"tests/test_scheduler.py" = ["DTZ001", "DTZ005"]

[tool.ruff.lint.flake8-bugbear]
# B008 normally flags a function call as a mutable/unsafe default value —
# but `Depends(...)` (and friends) as a default is FastAPI's own, intended
# way to declare a dependency; it isn't the footgun the rule exists for.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
exclude = ["src/pyforge/console/stubs"]

[[tool.mypy.overrides]]
# Neither ships type stubs/py.typed; both are only imported inside the
# optional storage/cache/queue drivers, never at the top level.
module = ["boto3.*", "botocore.*", "redis.*"]
ignore_missing_imports = true
