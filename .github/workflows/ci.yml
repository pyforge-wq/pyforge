name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: mypy src/pyforge

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  generated-project-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Generate a project and prove it boots, migrates, and tests pass
        run: |
          pyforge new smoke_test_app --path "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/smoke_test_app"
          pip install -e "$GITHUB_WORKSPACE"
          pytest -v
          pyforge route:list
          pyforge make:model Post --migration
          pyforge migrate
          pyforge migrate:status
          pyforge db:seed
          pyforge migrate:rollback

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" build
      - name: Build a real framework wheel and a fresh generated project
        run: |
          python -m build --wheel --outdir /tmp/pyforge_dist .
          pyforge new docker_smoke_app --path "$RUNNER_TEMP"
          cp /tmp/pyforge_dist/*.whl "$RUNNER_TEMP/docker_smoke_app/"
      - name: Point the generated project at the local wheel
        working-directory: ${{ runner.temp }}/docker_smoke_app
        run: |
          WHEEL=$(basename /tmp/pyforge_dist/*.whl)
          sed -i 's/"pyforge-framework>=0.1.0"/"pyforge-framework"/' pyproject.toml
          sed -i "s#COPY \. \.#COPY . .\nRUN pip install $WHEEL#" Dockerfile
      - name: Build and run the generated Dockerfile, then prove it serves
        working-directory: ${{ runner.temp }}/docker_smoke_app
        run: |
          docker build -t docker_smoke_app .
          docker run -d -p 8000:8000 --name docker_smoke_app docker_smoke_app
          for i in $(seq 1 10); do curl -sf http://localhost:8000/ && break || sleep 1; done
          curl -sf http://localhost:8000/
          docker logs docker_smoke_app

  docs-site-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r docs-site/requirements.txt
      - name: Build the docs site strictly (fails on broken links/nav)
        working-directory: docs-site
        run: mkdocs build --strict

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
